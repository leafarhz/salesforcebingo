<template>
    <div class="bingo">
        <!-- ---------------------------------------------- Entry -->
        <template lwc:if={showEntry}>
            <div class="entry">
                <div class="masthead">
                    <template lwc:if={hasLogo}>
                        <img class="masthead__logo" src={event.logoUrl} alt="" />
                    </template>
                    <p class="masthead__event">{event.eventName}</p>
                    <p class="masthead__meta">{event.eventMeta}</p>
                    <h1 class="masthead__title">{event.gameTitle}</h1>
                    <p class="masthead__tag">{event.tagline}</p>
                </div>

                <template lwc:if={hasSession}>
                    <div class="session">
                        <p class="session__name">{event.sessionName}</p>
                        <p class="session__details">{event.sessionDetails}</p>
                    </div>
                </template>
                <p class="entry__lede">{event.welcomeMessage}</p>

                <label class="entry__label" for="email">Email</label>
                <input id="email" class="entry__input" type="email" inputmode="email"
                       autocomplete="email" placeholder="you@example.com"
                       value={email} oninput={handleEmailInput} />

                <label class="entry__label" for="name">Display name (for the leaderboard)</label>
                <input id="name" class="entry__input" type="text" maxlength="120"
                       autocomplete="name" placeholder="How should we call you?"
                       value={displayName} oninput={handleNameInput} />

                <p class="entry__notice">{event.privacyNotice}</p>

                <template lwc:if={errorMessage}>
                    <p class="bingo__error" role="alert">{errorMessage}</p>
                </template>

                <button type="button" class="entry__btn" disabled={startDisabled}
                        onclick={handleStart}>{startLabel}</button>
            </div>
        </template>

        <!-- ---------------------------------------------- Grid -->
        <template lwc:elseif={showGrid}>
            <header class="head">
                <div class="head__top">
                    <h1 class="head__title">{greeting}</h1>
                    <button type="button" class="head__switch" onclick={handleSwitch}>{switchLabel}</button>
                </div>
                <p class="head__progress">{progressLabel}</p>
                <template lwc:if={score}>
                    <p class="head__score"><strong>{score.total}</strong> points — {scoreLabel}</p>
                </template>
                <div class="head__bar" role="progressbar">
                    <div class="head__bar-fill" style={progressStyle}></div>
                </div>
            </header>

            <template lwc:if={hasWon}>
                <p class="win" role="status">{winMessage}</p>
            </template>

            <template lwc:if={errorMessage}>
                <p class="bingo__error" role="alert">{errorMessage}</p>
            </template>

            <div class="grid grid--letters" aria-hidden="true">
                <template for:each={bingoLetters} for:item="head">
                    <div key={head.key} class="letter">{head.letter}</div>
                </template>
            </div>

            <div class="grid">
                <template for:each={squares} for:item="square">
                    <c-bingo-square
                        key={square.key}
                        square={square}
                        onsquareselect={handleSquareSelect}
                    ></c-bingo-square>
                </template>
            </div>

            <p class="hint">Tap any square to read it and record who you met.</p>

            <template lwc:if={showLeaderboardLink}>
                <p class="foot"><a href={leaderboardUrl} class="foot__link">See the leaderboard →</a></p>
            </template>
        </template>

        <!-- ---------------------------------------------- Zoomed tile -->
        <template lwc:elseif={showTile}>
            <template lwc:if={errorMessage}>
                <p class="bingo__error" role="alert">{errorMessage}</p>
            </template>

            <c-bingo-tile-detail
                square={selected}
                busy={busy}
                searching={searching}
                search-results={searchResults}
                onsearch={handleSearch}
                onmark={handleMark}
                onunmark={handleUnmark}
                onclose={handleClose}
            ></c-bingo-tile-detail>
        </template>
    </div>
</template>
